# Local development services only. The deployment is compose.prod.yaml.
services:
  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env (see .env.example)}
      POSTGRES_DB: launch_rush
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  redis-data:
  postgres-data:
